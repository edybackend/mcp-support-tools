name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      # Warnings are errors (Directory.Build.props), so analyzers and code style gate the build.
      - run: dotnet build --no-restore -c Release
      # Redaction rules, and the server end to end through the official MCP C# client.
      - run: dotnet test --no-build -c Release

  container:
    name: Container (raw JSON-RPC over Streamable HTTP)
    runs-on: ubuntu-latest
    needs: [dotnet]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Talk MCP to the container the way any client would
        run: |
          set -euo pipefail
          docker compose up -d
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 2; done
          rpc() { curl -s http://localhost:8080/mcp -H "Authorization: Bearer $1" -H 'content-type: application/json' \
                    -H 'accept: application/json, text/event-stream' -d "$2" | sed -n 's/^data: //p'; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp -H 'content-type: application/json' -d '{}')" = 401 ]
          rpc dev-readonly-key-change-me '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | jq -e '.result.serverInfo.name == "support-desk"'
          [ "$(rpc dev-readonly-key-change-me '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | jq '.result.tools | length')" -eq 4 ]
          [ "$(rpc dev-agent-key-change-me '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | jq '.result.tools | length')" -eq 7 ]
          rpc dev-readonly-key-change-me '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_ticket","arguments":{"ticketId":"T-1001"}}}' \
            | jq -e '.result.structuredContent.customer.email == "a***@example.com"'
          rpc dev-agent-key-change-me '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"add_internal_note","arguments":{"ticketId":"T-1001","note":"card 4242 4242 4242 4242"}}}' \
            | jq -e '.result.isError == true'
      - if: always()
        run: docker compose logs && docker compose down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; the action builds a "<first>^..HEAD" range that fails on a root commit.
      - name: Scan full git history with gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
