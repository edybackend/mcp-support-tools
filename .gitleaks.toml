# Default gitleaks rules, plus one narrow exception.
# (Global [allowlist] syntax: gitleaks 8.24 does not apply the newer [[allowlists]] tables here. Regex only, no path
# allowlist: with this syntax a path would exempt the whole file.)
[extend]
useDefault = true

[allowlist]
description = "Public demo API keys (dev-…-change-me, documented in the README) and their SHA-256 fingerprints"
regexTarget = "match"
regexes = ['''KeySha256":\s*"[0-9a-f]{64}"''']
# A finding whose secret contains this word is the documented demo key, used in curl examples and .mcp.json.
stopwords = ["-change-me"]
